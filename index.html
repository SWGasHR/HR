<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HR Project Portal</title>
  <link rel="icon" type="image/png" href="/HR/department.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f7f8fc;
    }

    .portal-error {
      display: none;
      min-height: 100%;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
      color: #121e66;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="portal-error" id="portalError" role="alert">
    <div>
      <p>The HR Project Portal couldn’t load. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Reload portal</button>
    </div>
  </div>
  <noscript>Turn on JavaScript in your browser to open the HR Project Portal.</noscript>

  <script>
    /*
      LOADER for the HR Project Portal.

      Keep index.html and 404.html identical. GitHub Pages serves 404.html
      for clean department links. Both entry points check the portal shell
      and its configuration for updates each time the portal opens. The
      browser can reuse either response when its copy is still current.
    */
    (async function () {
      "use strict";

      /* The Comms Timeline is its own page (comms-timeline.html), not a
         department portal, so send its clean URL straight there before
         loading the portal shell. */
      if (/^\/hr\/comms-timeline(\/|$)/i.test(window.location.pathname)) {
        window.location.replace("/HR/comms-timeline.html" + window.location.search + window.location.hash);
        return;
      }

      const PORTAL_URL = "/HR/portal.html";
      const CONFIG_URL = "/HR/portal-config.js";

      try {
        const [portalResponse, configResponse] = await Promise.all([
          fetch(PORTAL_URL, { cache: "no-cache" }),
          fetch(CONFIG_URL, { cache: "no-cache" })
        ]);

        if (!portalResponse.ok) {
          throw new Error("The portal content could not be loaded (" + portalResponse.status + ").");
        }

        const html = await portalResponse.text();

        // Basic sanity check that we received the real portal and not, for
        // example, an error page returned with a 200 status.
        if (!/<html\s[^>]*\bdata-hr-portal-shell\b[^>]*>/i.test(html)) {
          throw new Error("The portal content did not look valid.");
        }

        /* Run the content file first so window.HR_PORTAL_DATA exists by
           the time the portal boots. A typo in portal-config.js is
           recorded instead of thrown, so the portal can still render its
           recovery message. */
        try {
          if (!configResponse.ok) {
            throw new Error("portal-config.js could not be loaded (" + configResponse.status + ").");
          }
          const configSource = await configResponse.text();
          new Function(configSource)();
          if (!window.HR_PORTAL_DATA) {
            throw new Error("portal-config.js ran but did not set window.HR_PORTAL_DATA.");
          }
        } catch (configError) {
          console.error(configError);
          window.__hrPortalConfigError = String(configError);
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        const errorMessage = document.getElementById("portalError");
        if (errorMessage) {
          errorMessage.style.display = "grid";
        }
      }
    })();
  </script>
</body>
</html>
